name: Research tooling self-tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/research-tooling-tests.yml"

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python3 scripts/test_phi.py

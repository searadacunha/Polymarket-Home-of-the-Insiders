name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the complete published snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test isolated ChangeNOW collection corrections
        run: python3 investigations/ballon-dor-census/tests/test_changenow_fix.py
      - name: Test publication safeguards
        run: python3 scripts/test_publication.py
      - name: Preserve accepted README and archived Relay evidence
        env:
          PUBLICATION_TARGET: ${{ github.base_ref || github.ref_name }}
          PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--target "$PUBLICATION_TARGET" --candidate HEAD --head "$PUBLICATION_HEAD")
          if [ -n "$PUBLICATION_BASE" ]; then
            args+=(--base-ref "$PUBLICATION_BASE")
          fi
          python3 scripts/check_publication.py "${args[@]}"
      - name: Verify archived Relay trace
        run: python3 research_notes/relay-followup-2026-11-04/verify.py
      - name: Test central utilities
        run: python3 scripts/test_phi.py
      - name: Test evidence, import and recovery regressions
        run: python3 scripts/test_integrity_regressions.py
      - name: Test concurrent publication and CI gates
        run: python3 scripts/test_parallel_publication.py
      - name: Validate published evidence and manifests
        run: python3 scripts/validate_evidence.py
      - name: Check generated reports
        run: python3 scripts/build_master_report.py --check
